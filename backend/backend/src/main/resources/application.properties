spring.application.name=CampusHub-backend
spring.profiles.active=dev
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

server.port=${SERVER_PORT:9090}
server.address=0.0.0.0
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show.sql=true
spring.jpa.hibernate.ddl-auto=update

# Custom error messages
server.error.include-message=always
server.error.include-binding-errors=always

logging.level.com.campushub.backend=DEBUG

#--------------------------------
#db auditing
#--------------------------------
spring.jpa.properties.hibernate.envers.enabled=true
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

#--------------------------------
#togglz
#--------------------------------
togglz.feature.enums=com.campushub.backend.configurations.togglz.Features
togglz.enabled=true
togglz.cache.enabled=true
togglz.console.enabled=true
togglz.console.path=/togglz-console
togglz.console.security=true

# Maximum file upload size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Database connection pool (important for BLOB handling)
spring.datasource.hikari.maximum-pool-size=10

#API doc url
springdoc.api-docs.path=/api-docs
app.security.cookie.secure=${APP_SECURITY_COOKIE_SECURE:false}
app.security.csrf.cookie.domain=${APP_SECURITY_CSRF_COOKIE_DOMAIN:}
jwt.secret.key=${JWT_SECRET_KEY}
jwt.expiration.ms=${JWT_EXPIRATION_MS:3600000}

# Email verification
app.verification.base-url=${APP_VERIFICATION_BASE_URL:http://localhost:9090/auth/verify-email}
app.password-reset.base-url=${APP_PASSWORD_RESET_BASE_URL:http://localhost:5174/reset-password}
app.mail.from=${APP_MAIL_FROM:akaddoura404@gmail.com}

# SMTP (required for actually sending verification emails)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_SMTP_WRITE_TIMEOUT:5000}

# Stripe payment
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.currency=${STRIPE_CURRENCY:usd}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:5173/?payment=success&listingId={LISTING_ID}&session_id={CHECKOUT_SESSION_ID}}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:5173/?payment=cancelled&listingId={LISTING_ID}}

# AI search (Hugging Face)
app.ai.huggingface.api-token=${HUGGINGFACE_API_TOKEN:}
app.ai.huggingface.model=${HUGGINGFACE_MODEL:sentence-transformers/all-MiniLM-L6-v2}
