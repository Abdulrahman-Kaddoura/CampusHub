spring.application.name=CampusHub-backend
spring.profiles.active=local

# Defaults make local startup simple; docker/env values still override.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:campushub;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

server.port=${SERVER_PORT:9090}
server.address=0.0.0.0
# Frontend expects /api/* (Vite proxy); backend controllers are /auth, /listings, etc.
server.servlet.context-path=/api

spring.jpa.show.sql=true
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Custom error messages
server.error.include-message=always
server.error.include-binding-errors=always

# db auditing – Envers disabled (audit tables not auto-created with H2; re-enable with migrations if needed)
spring.jpa.properties.hibernate.envers.enabled=false
spring.jpa.properties.hibernate.integration.envers.enabled=false
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

# togglz
togglz.feature.enums=com.campushub.backend.configurations.togglz.Features
togglz.enabled=true
togglz.cache.enabled=true
togglz.console.enabled=true
togglz.console.path=/togglz-console
togglz.console.security=false

# Maximum file upload size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Database connection pool
spring.datasource.hikari.maximum-pool-size=10

# API doc url
springdoc.api-docs.path=/api-docs

# jwt
jwt.secret=${JWT_SECRET:campusHubSuperSecretKeyThatShouldBeChangedInProduction}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
