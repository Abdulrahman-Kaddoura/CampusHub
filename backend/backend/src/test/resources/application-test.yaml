spring:
  datasource:
    url: jdbc:h2:mem:campushub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  mail:
    host: localhost
    port: 2525
    username: test
    password: test
  flyway:
    enabled: false

jwt:
  secret:
    key: 01234567890123456789012345678901
  expiration:
    ms: 3600000

app:
  security:
    cookie:
      secure: false
    csrf:
      cookie:
        domain: ""

togglz:
  enabled: false
  console:
    enabled: false
