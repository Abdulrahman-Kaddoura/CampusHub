events {
    worker_connections 1024;
}

http {
    map $http_origin $cors_allow_origin {
        default "";
        "http://localhost:3000" $http_origin;
        "http://localhost:4173" $http_origin;
        "https://campushub.shop" $http_origin;
        "https://www.campushub.shop" $http_origin;
    }

    upstream campus_hub_backend {
        server backend1:9090 max_fails=3 fail_timeout=30s;
        server backend2:9090 max_fails=3 fail_timeout=30s;
    }

    # Redirect all HTTP to HTTPS
    server {
        listen 80;
        server_name campushub.shop www.campushub.shop;

        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name campushub.shop www.campushub.shop;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Recommended modern TLS settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";

        # Frontend
        location / {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend API
        location /api/ {
            # Handle CORS preflight entirely here.
            # NOTE: add_header directives outside an if block are NOT inherited
            # inside it, so all required CORS headers must live inside this block.
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_allow_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-XSRF-TOKEN' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://campus_hub_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # CORS headers for actual requests are handled by Spring Boot.
            # Do not add them here to avoid duplicate header rejections by browsers.
        }
    }
}
